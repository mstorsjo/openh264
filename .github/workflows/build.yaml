name: CI

on: 
  push:
  pull_request:

jobs:
  build:
    if: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -qq nasm g++-multilib gcc-multilib libc6-dev-i386 python3-pip python3-setuptools
      - run: sudo python3 -m pip install meson==0.52.1 ninja
      - run: nasm -v 
      - run: c++ --version
      - run: make gmp-bootstrap
      - run: make gtest-bootstrap
      - run: meson builddir --werror
      - run: ninja -C builddir -v
      - run: ( cd test/encoder_binary_comparison ; CFLAGS=-Werror ./run_PrepareAllTestData.sh 64 )
      - run: meson test -C builddir -v
      - run: ./run_Test.sh BinaryCompare BA_MW_D.264
      - run: ./run_Test.sh BinaryCompare Adobe_PDF_sample_a_1024x768_50Frms.264
      - run: ./run_Test.sh BinaryCompare Zhling_1280x720.264

  asan:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -qq nasm
      - run: nasm -v
      - run: c++ --version
      - run: make gtest-bootstrap
      - run: LDFLAGS=-fsanitize=address CFLAGS=-fsanitize=address make -j$(nproc)
      - run: ./codec_unittest

  windows:
    if: false
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v3
      - run: choco install nasm
      # nasm is not installed into the $PATH so add it manually
      - run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - run: nasm -v
      - run: make OS=msvc gmp-bootstrap
      - run: make OS=msvc gtest-bootstrap
      - working-directory: ./build
        env:
          CFLAGS: -WX
        run: ./AutoBuildForWindows.bat
      - run: ./bin/Win32/Release/codec_unittest.exe

  msvc-arm64:
    runs-on: windows-latest
    if: false
    steps:
      - uses: actions/checkout@v3
      - run: make OS=msvc gmp-bootstrap
      - run: make OS=msvc gtest-bootstrap
      - working-directory: ./build
        env:
          CFLAGS: -WX
        run: ./AutoBuildForWindows.bat ARM64-Release-ASM

  msvc-arm64-manual:
    runs-on: windows-latest
    steps:
      - name: Set up the environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - uses: actions/checkout@v3
      - run: make OS=msvc gmp-bootstrap
      - run: make OS=msvc gtest-bootstrap
      - run: make OS=msvc ARCH=arm64

  msvc-arm64-gas-preprocessor:
    runs-on: windows-latest
    steps:
      - name: Set up the environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - uses: actions/checkout@v3
      - name: Checkout gas-preprocessor
        uses: actions/checkout@v4
        with:
          repository: ffmpeg/gas-preprocessor
          ref: 7380ac24e1cd23a5e6d76c6af083d8fc5ab9e943
          path: gas-preprocessor
      - name: Add gas-preprocessor to PATH
        run: |
          echo "$PWD\gas-preprocessor" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
      - run: make OS=msvc gmp-bootstrap
      - run: make OS=msvc gtest-bootstrap
      - run: make OS=msvc ARCH=arm64 CCAS="gas-preprocessor.pl -as-type armasm -arch aarch64 -- armasm64" CCASFLAGS="-nologo -DHAVE_NEON_AARCH64"

  llvm-mingw:
    runs-on: ubuntu-latest
    steps:
      - name: Install llvm-mingw
        run: |
          curl -LO https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -Jxf llvm-mingw-*-ucrt-ubuntu-*-x86_64.tar.xz
          rm llvm-mingw-*.tar.xz
          mv llvm-mingw-* /opt/llvm-mingw
          echo /opt/llvm-mingw/bin >> $GITHUB_PATH
      - uses: actions/checkout@v3
      - run: make gmp-bootstrap
      - run: make gtest-bootstrap
      - run: CFLAGS=-Werror make -j$(nproc) OS=mingw_nt ARCH=aarch64 CC=aarch64-w64-mingw32-gcc CXX=aarch64-w64-mingw32-g++ AR=aarch64-w64-mingw32-ar

  mingw:
    if: false
    runs-on: windows-2019
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-meson
      - uses: actions/checkout@v3
      - run: c++ --version
      - run: make gmp-bootstrap
      - run: make gtest-bootstrap
      - run: CFLAGS=-Werror make -j$(nproc) all plugin test
      - run: meson builddir --werror
      - run: ninja -C builddir -v
      - run: meson test -C builddir -v

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-13 # x86_64
          - macos-latest # aarch64
    runs-on: ${{matrix.runner}}
    steps:
      - uses: actions/checkout@v3
      - run: brew install nasm meson
      - run: make gmp-bootstrap
      - run: make gtest-bootstrap
      - run: nasm -v
      - run: c++ --version
      - run: CFLAGS=-Werror make -j$(sysctl -n hw.ncpu) all plugin test
      - run: meson builddir --werror
      - run: ninja -C builddir -v
      - run: meson test -C builddir -v

  linux-cross-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -qq g++-arm-linux-gnueabihf g++-aarch64-linux-gnu qemu-user
      - run: arm-linux-gnueabihf-g++ --version
      - run: aarch64-linux-gnu-g++ --version
      - run: make gmp-bootstrap
      - run: make gtest-bootstrap
      - run: CFLAGS=-Werror make -j$(nproc) ARCH=aarch64 CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++
      - run: qemu-aarch64 -L /usr/aarch64-linux-gnu/ ./codec_unittest

  ios-cross-arm64:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - run: make gmp-bootstrap
      - run: make gtest-bootstrap
      - run: c++ --version
      - run: CFLAGS=-Werror make -j$(sysctl -n hw.ncpu) OS=ios ARCH=arm64

  fuzzing:
    if: false
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
      with:
        oss-fuzz-project-name: 'openh264'
        language: c++
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
      with:
        oss-fuzz-project-name: 'openh264'
        language: c++
        fuzz-seconds: 600
    - name: Upload Crash
      uses: actions/upload-artifact@v4
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
